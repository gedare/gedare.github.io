- abstract: "In \\\"BUNDLE: Real-Time Multi-Threaded Scheduling to Reduce
    Cache Contention\\\" Tessler and Fisher present a positive perspective
    of instruction caches for hard real-time multithreaded tasks. The
    thread-aware scheduling algorithm limits the execution of threads to
    sets of instructions that cannot result in cache conflicts.
    Identification of these sets result in conflict free regions which
    are used to identify scheduling groups called bundles in the BUNDLE
    scheduling algorithm. Placement of a thread in a particular bundle
    depends on, what the authors call, \\\"anticipating execution\\\".
    However, they do not define a complete mechanism to anticipate
    execution. In this work, we propose a method to anticipate execution
    that modifies cache hardware and introduces a new interrupt raised
    prior to a cache conflict. This new interrupt is combined with (a
    slightly modified version of) the BUNDLE scheduling algorithm. The
    intent is to implement these hardware modifications for ARM on the
    gem5 simulator with the scheduling algorithm integrated into the
    RTEMS operating system. The hope is this work serves as further
    motivation to bring the positive perspective of caches to physical
    processors and operating systems."
