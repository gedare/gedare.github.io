- abstract: In this poster, we introduce path-aware risk scores for
    access control (PARSAC), a novel context-sensitive technique to
    enrich access requests with risk scoring of the path taken by those
    requests between the authenticated user and the resources they
    access. These path-aware risk scores enable another layer of
    security for traditional access control systems that addresses the
    need for fine-grained monitoring and enforcement within a zero-trust
    architecture. We define rules for general functions that can be used
    to determine risk and instantiate a specific approach to calculate
    path risk scores. We evaluate our approach with realistic network
    graphs; PARSAC finds more paths with lower risk when compared with
    traditional routing algorithms that select the shortest path.
