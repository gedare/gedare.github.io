- abstract: Vehicle platooning provides benefits that include improved
    road capacity and fuel efficiency. These benefits improve as vehicle
    spacing is reduced. Fully networked platoons further share more
    information among platoon members that could better inform
    controller decisions and detect platoon disturbances in the
    environment. The use of a fully networked topology in vehicle
    platooning has not been well studied. In this paper, we evaluate
    distributed controller control policies using a fully networked
    topology. We also present a novel control policy, called quantized
    constant time headway (QCTH), which discretizes the velocity
    reference used in the constant time headway policy to gain the
    stability benefits of a constant distance policy. Compared to three
    other policies in two scenarios, QCTH is the only stable option in a
    fully networked topology that allows inter-vehicle spacing to adjust
    with platoon velocity.
  accessed: 2025-06-23
