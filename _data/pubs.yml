- abstract: The goal of a real-time operating system (RTOS) is to
    support real-time and embedded system (RT/ES) application
    development, which differ from general-purpose applications because
    of the size, weight, and power (SWaP) and timing constraints imposed
    by embedded applications. Useful RTOS features include real-time
    thread scheduling, thread communication, synchronization, interrupt
    handling, memory management, file systems, device drivers,
    networking, and debugging support. The Real-Time Executive for
    Multi-processor Systems (RTEMS) is a free and open-source RTOS that
    supports over a dozen processor architecture families and over 150
    embedded system boards. RTEMS is designed to support embedded
    applications with stringent real-time requirements while being
    compatible with open standards such as POSIX. RTEMS includes
    optional services such as TCP/IP networking and file systems while
    still offering minimum executable sizes under 20 KB in useful
    configurations. One of the primary functions of an RTOS is to select
    threads that can obtain access to resources such as shared memory
    and processor time. RTEMS uses multiple algorithms to manage both
    waiting threads and those ready to execute. The thread execution
    schedulers include the traditional RTOS round robin and
    deterministic priority schedulers, rate monotonic, earliest deadline
    first (EDF), constant bandwidth server (CBS), and simple SMP
    scheduling algorithms. The RTEMS scheduling framework allows the
    application developer to select the thread scheduling algorithm that
    best meets the application's space and time requirements. ÂăWe will
    present how this framework can be used by researchers to integrate
    their own scheduling algorithm into RTEMS and test it using a
    scheduling simulator before deploying it on target hardware.
