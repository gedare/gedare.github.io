- abstract: Controlling software systems autonomously has been a
    challenging research area. Modern autonomous systems are guided by a
    plan, which is a sequence of actions to take to achieve a goal. Many
    planning algorithms exist today to produce plans given a problem
    definition and goal. To ease programmability of autonomous systems,
    many languages have been developed for defining problems and goals.
    However, planning algorithms tend to need to be customized not only
    for the problem definition language, but also for the problem
    definition itself. This work presents a new problem definition
    language called PyLOM, an interpreted, object-oriented language. The
    PyLOM run-time system uses generic algorithms, which do not need to
    be customized for each problem definition. Thus, PyLOM separates
    problem definitions from planning algorithms to ease programmability
    and software reuse. The choice of an object-oriented language also
    is intended to aid programmability, since prior problem definition
    languages adopt a functional programming style.
