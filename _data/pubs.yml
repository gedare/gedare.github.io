- abstract: Vehicle platooning inspires the future of transportation and
    yet introduces the possibility for physical attacks to disrupt
    autonomy operations. In this paper, we evaluate platoon resiliency
    in the presence of such attacks. Our evaluation includes 60 unique
    combinations of controller, control policy, and topology with an
    equal weight control schema while attacking specific platoon
    members. The experimental results show that the targeted vehicle,
    network topology, control policy, and controller all influence
    platoon resiliency with some configurations leading to platoon
    instability.
  accessed: 2025-06-23
