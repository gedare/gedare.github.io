- abstract: The Internet of Things (IoT) offers immense benefits by
    enabling devices to leverage networked resources thereby making
    intelligent decisions. The numerous heterogeneous connected devices
    that exist throughout the IoT system creates new security and
    privacy concerns. Some of these concerns can be overcome through
    trust, transparency, and integrity, which can be achieved with data
    provenance. Data provenance, also known as data lineage, provides a
    history of transformations that occurs on a data object from the
    time it was created to its current state. Data provenance has been
    explored in the areas of scientific computing, business, forensic
    analysis, and intrusion detection. Data provenance can help in
    detecting and mitigating malicious cyber attacks. In this paper, we
    explore the integration of provenance within the IoT. We introduce
    Provenance Aware Internet of Things System (PAIoTS), a provenance
    collection framework for IoT devices. We evaluate the effectiveness
    of our framework by developing a prototype system for proof of
    concept.
