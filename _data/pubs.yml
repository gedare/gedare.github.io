- abstract: Network intrusion detection systems (NIDS) today must
    quickly provide visibility into anomalous behavior on a growing
    amount of data. Meanwhile different data models have evolved over
    time, each providing a different set of features to classify
    attacks. Defenders have limited time to retrain classifiers, while
    the scale of data and feature mismatch between data models can
    affect the ability to periodically retrain. Much work has focused on
    classification accuracy yet feature selection is a key part of
    machine learning that, when optimized, reduces the training time and
    can increase accuracy by removing poorly performing features that
    introduce noise. With a larger feature space, the pursuit of more
    features is not as valuable as selecting better features. In this
    paper, we use an ensemble approach of filter methods to rank
    features followed by a voting technique to select a subset of
    features. We evaluate our approach using three datasets to show
    that, across datasets and network topologies, similar features have
    a trivial effect on classifier accuracy after removal. Our approach
    identifies poorly performing features to remove in a
    classifier-agnostic manner that can significantly save time for
    periodic retraining of production NIDS.
