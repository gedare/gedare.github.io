- abstract: Schedule randomization is one of the recently introduced
    security defenses against schedule-based attacks, i.e., attacks
    whose success depends on a particular ordering between the execution
    window of an attacker and a victim task within the system. It falls
    into the category of information hiding (as opposed to deterministic
    isolation-based defenses) and is designed to reduce the attacker's
    ability to infer the future schedule. This paper aims to investigate
    the limitations and vulnerabilities of schedule randomization-based
    defenses in real-time systems. We first provide definitions,
    categorization, and examples of schedule-based attacks, and then
    discuss the challenges of employing schedule randomization in
    real-time systems. Further, we provide a preliminary security test
    to determine whether a certain timing relation between the attacker
    and victim tasks will never happen in systems scheduled by a
    fixed-priority scheduling algorithm. Finally, we compare
    fixed-priority scheduling against schedule-randomization techniques
    in terms of the success rate of various schedule-based attacks for
    both synthetic and real-world applications. Our results show that,
    in many cases, schedule randomization either has no security
    benefits or can even increase the success rate of the attacker
    depending on the priority relation between the attacker and victim
    tasks.
