- abstract: The IEEE 802.1Q working group defines the Ethernet
    time-sensitive networking (TSN) standard to support data-intensive
    industrial real-time networks. Unfortunately, TSN has the
    possibility for frame priority inversion that can lead to deadline
    misses. In this paper, we present a novel approach to address
    priority inversion in TSN that prioritizes frames during network
    configuration, determines traffic paths off-line with integer linear
    programming (ILP), and schedules transmissions on-line using the
    earliest deadline first (EDF) algorithm. Our approach, the ILP
    deadline-based TSN (ILP-DTSN), optimizes the network for
    time-sensitive traffic while minimizing the blocking effects of
    preemption. ILP-DTSN results in fewer missed deadlines compared with
    the time-aware shaper (TAS) with one-level preemption while reducing
    average end-to-end latency by up to 32%.
