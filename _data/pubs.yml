- abstract: Malware detection and analysis can be a burdensome task for
    incident responders. As such, research has turned to machine
    learning to automate malware detection and malware family
    classification. Existing work extracts and engineers static and
    dynamic features from the malware sample to train classifiers.
    Despite promising results, such techniques assume that the analyst
    has access to the malware executable file. Self-deleting malware
    invalidates this assumption and requires analysts to find forensic
    evidence of malware execution for further analysis. In this paper,
    we present and evaluate an approach to detecting malware that
    executed on a Windows target and further classify the malware into
    its associated family to provide semantic insight. Specifically, we
    engineer features from the Windows prefetch file, a file system
    forensic artifact that archives process information. Results show
    that it is possible to detect the malicious artifact with 99%
    accuracy; furthermore, classifying the malware into a fine-grained
    family has comparable performance to techniques that require access
    to the original executable. We also provide a thorough security
    discussion of the proposed approach against adversarial diversity.
