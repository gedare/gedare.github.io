- abstract: "Industrial control system (ICS) denotes a system consisting
    of actuators, control stations, and network that manages processes
    and functions in an industrial setting. The ICS community faces two
    major problems to keep pace with the broader trends of Industry 4.0:
    (1) a data rich, information poor (DRIP) syndrome, and (2) risk of
    financial and safety harms due to security breaches. In this paper,
    we propose a private cloud in the loop ICS architecture for
    real-time analytics that can bridge the gap between low data
    utilization and security hardening."
