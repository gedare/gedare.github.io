- abstract: "The Internet-of-Things (IoT) is a large and complex domain.
    These systems are often constructed using a very diverse set of
    hardware, software and protocols. This, combined with the ever
    increasing number of IoT solutions/services that are rushed to
    market means that most such systems are rife with security holes.
    Recent incidents (e.g., the Mirai botnet) further highlight such
    security issues. With emerging technologies such as blockchain and
    software-defined networks (SDNs), new security solutions are
    possible in the IoT domain. In this paper we will explore future
    trends in IoT security: (a) the use of blockchains in IoT security,
    (b) data provenance for sensor information, (c) reliable and secure
    transport mechanisms using SDNs (d) scalable authentication and
    remote attestation mechanisms for IoT devices and (e) threat
    modeling and risk/maturity assessment frameworks for the domain."
