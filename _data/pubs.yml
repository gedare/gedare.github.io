- abstract: In recent years, ransomware has evolved to target Internet
    of things (IoT) devices, such as medical equipment and thermostats.
    Traditional ransomware detection methods may not be effective for
    resource-constrained IoT devices as IoT-based ransomware is geared
    towards impairing functionality rather than accessing data.
    Therefore, this article proposes L-IDS, a lightweight
    hardware-assisted intrusion detection system that combines
    hardware-assisted security, such as Trusted Execution Environment,
    with machine learning algorithms to detect and mitigate ransomware
