- abstract: Industrial control system (ICS) protocols face the threat of
    adversaries launching cyber-physical attacks against protocol
    endpoints. Vulnerability discovery approaches such as fuzzing can be
    effective at reducing the risk of such threats. In this paper, we
    present MCFICS, a coverage-guided greybox fuzzing framework that
    uses (1) active automata learning for stochastic reactive systems to
    infer the state machine of a stateful ICS protocol server
    implementation, and (2) guided fuzzing to explore the state space
    using this learned state machine. During fuzzing, new input
    sequences that increase code coverage are used to improve the state
    space exploration of the ICS protocol implementations. We
    implemented and tested MCFICS with six example server
    implementations spanning three widely used ICS protocol
    implementations. Experimental results show that MCFICS achieves
    higher branch coverage than the AFLNwe, AFLNet and StateAFL fuzzers
    by an average (mean of means) of 15.82%, 1.99%, and 37.52%,
    respectively, with an overall average of 18.44% increased branch
    coverage. Furthermore, using MCFICS we discovered a new bug in a
    protocol implementation that we have reported to its upstream
    maintainer.
  accessed: 2025-06-23
