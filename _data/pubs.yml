- abstract: Real-Time Executive for Multiprocessor Systems (RTEMS) is a
    real-time operating system used by the Experimental Physics and
    Industrial Control System (EPICS) open-source software for
    high-precision scientific instruments such as particle accelerators
    and telescopes. EPICS relies on the networking capabilities of RTEMS
    for microcontrollers that need to meet real-time constraints.
    However, the networking available in RTEMS either lacks the
    necessary drivers to be fully operational or lacks security features
    required in modern networks. In this paper, we introduce a modular
    networking architecture for RTEMS by separating the network software
    implementation and device drivers from the RTEMS kernel to provide
    them as a static library for applications to use. This
    networking-as-a-library concept provides application developers with
    better capabilities to select the network features needed for their
    target application and to keep their networking software undated and
    secure.
