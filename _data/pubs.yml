- abstract: In a network of mining pools that secure Bitcoin-like
    blockchains, it is known that a self-interested mining pool can
    dishonestly siphon off another pool's mining rewards by executing a
    block withholding (BWH) attack. In this paper, we show that a BWH
    attack is always unprofitable for an initial startup period which is
    at least one difficulty retarget interval (approximately 14 days for
    Bitcoin). Furthermore, we prove that the payback period to recoup
    this initial startup cost is always at least as long as the initial
    unprofitable startup interval, and we show numerically that it can
    be substantially longer. Thus, the decision of whether or not to
    execute a BWH attack is not a dominant strategy, and the so called
    Miner's Dilemma is not in fact a dilemma.
